<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node.js Test Page</title>
</head>
<body>
    <h1>Test Node.js Server</h1>
    <button id="test-button">Test Request</button>
    <div id="response-area"></div>

    <script>
        document.getElementById('test-button').addEventListener('click', function() {
            fetch('/test') // Assuming '/test' is your endpoint
                .then(response => response.text())
                .then(data => {
                    document.getElementById('response-area').textContent = data;
                })
                .catch(error => {
                    document.getElementById('response-area').textContent = 'Error: ' + error;
                });
        });
    </script>
</body>
</html>
